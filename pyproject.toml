[project]
name = "arrowyn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vasileios Bardakos", email = "vasilisbardakos@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
arrowyn = "arrowyn:main"

[tool.maturin]
module-name = "arrowyn._core"
python-packages = ["arrowyn"]
python-source = "src"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"
